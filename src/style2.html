<style>
/* archivio */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tabs .spacer{flex:1}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--c-soc);border-color:var(--c-soc)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:14px;color:var(--muted);padding:6px 0}
.results{display:flex;flex-direction:column}
.row{font:inherit;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:12px 4px;color:var(--ink);cursor:pointer;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:start}
.row:hover .rt{color:var(--accent)}
.row[aria-current="true"]{background:var(--surface)}
.row .dot{margin-top:7px}
.rt{font-family:var(--f-display);font-size:17px;line-height:1.3}
.ra{font-size:13.5px;color:var(--muted);margin-top:2px}
.rtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tg{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);background:var(--bg)}
.ry{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.topicbtn{font:inherit;background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink);cursor:pointer;padding:3px 11px;display:inline-flex;gap:6px;align-items:baseline}
.topicbtn small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.topicbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.topicbtn[aria-pressed="true"] small{color:var(--bg)}
.cloud{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline}
.near{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.sel-topics{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.affini li{list-style:none;margin:0 0 6px}
.affini{padding:0;margin:0}
.affini small{color:var(--muted);font-size:12px}
form.edit{display:flex;flex-direction:column;gap:12px}
form.edit label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
form.edit input,form.edit select,form.edit textarea{font:inherit;font-size:14.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;min-width:0;width:100%}
form.edit textarea{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.checks label{flex-direction:row!important;align-items:center;text-transform:none!important;letter-spacing:0!important;font-weight:400!important;color:var(--ink)!important;gap:6px!important}
.checks input{width:auto!important}
.helper{background:var(--bg);border:1px dashed var(--line);border-radius:5px;padding:12px;display:flex;flex-direction:column;gap:8px}
.helper p{font-size:13.5px;color:var(--muted)}
.msg{font-size:13.5px}
.msg.err{color:var(--c-soc)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
/* ecosistema teorico */
.ecowrap{position:relative;border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden}
#eco{display:block;width:100%;height:auto;touch-action:none;cursor:grab;user-select:none}
#eco:active{cursor:grabbing}
.el{stroke:var(--muted);opacity:.2;stroke-width:.8}
.ed{stroke:var(--ink);opacity:.4;stroke-width:1.3}
.en{cursor:pointer}
.en:focus{outline:none}
.en:focus-visible .mk{stroke:var(--accent);stroke-width:3}
.es .mk{stroke:var(--surface);stroke-width:1.5}
.etp .mk{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.esl{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.etl{font-size:9.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none;display:none}
#eco.zoomed .etl,.en.hl .etl{display:block}
#eco.dim .en{opacity:.13}
#eco.dim .en.hl{opacity:1}
#eco.dim .el{opacity:.03}
#eco.dim .el.hot{opacity:.9;stroke:var(--accent)}
#eco.searching .en:not(.match){opacity:.12}
.en.focus .mk{stroke:var(--ink);stroke-width:2.5}
#eco.no-topics .etp,#eco.no-topics .et{display:none}
#eco.no-decl .ed{display:none}
.ecoArea{font-family:var(--f-ui);font-size:15px;font-weight:900;letter-spacing:-.01em;paint-order:stroke;stroke:var(--surface);stroke-width:6px;stroke-linejoin:round;pointer-events:none}
.hull{opacity:.07;pointer-events:none}
.domc{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 5;pointer-events:none}
.domlbl{font-family:var(--f-ui);font-weight:800;letter-spacing:.14em;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:6px;pointer-events:none}
.macc{fill-opacity:.09;stroke-opacity:.45;stroke-width:1.2;cursor:zoom-in}
.macc:hover{fill-opacity:.16}
.maclbl{font-family:var(--f-ui);font-weight:900;letter-spacing:-.01em;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.lf{cursor:pointer}
.lf:focus{outline:none}
.lfc{fill-opacity:.85;stroke:var(--surface);stroke-width:1}
.lf:hover .lfc,.lf:focus-visible .lfc{stroke:var(--ink);stroke-width:2}
.lfcase{fill:var(--surface);opacity:.9;pointer-events:none}
.lfl{font-family:var(--f-ui);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.lk{fill:none;stroke:var(--ink);stroke-opacity:.55;pointer-events:none}
#eco.dim .lf{opacity:.18}
#eco.dim .lf.hl{opacity:1}
.lf.focus .lfc{stroke:var(--ink);stroke-width:3}
#eco.searching .lf:not(.match){opacity:.15}
.hullc{fill-opacity:.07;stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:3 4;cursor:zoom-in}
.hullc:hover{fill-opacity:.13}
.domsep{stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 6}
.rl{fill:none;pointer-events:none;transition:opacity .2s}
.rt{stroke-opacity:.38}
.rt.cross{stroke-opacity:.5}
.rd{stroke:var(--ink);stroke-opacity:.5}
#eco.no-decl .rd,#eco.no-temi .rt{display:none}
#eco.dim .rl{opacity:.06}
#eco.dim .rl.hot{opacity:1;stroke-opacity:.95}
.nd{cursor:pointer}
.nd:focus{outline:none}
.ndc{stroke:var(--surface);stroke-width:1.6}
.nd:hover .ndc,.nd:focus-visible .ndc{stroke:var(--ink);stroke-width:2.2}
.nd.focus .ndc{stroke:var(--ink);stroke-width:3}
.ndcase{fill:var(--surface);opacity:.9;pointer-events:none}
.ndl{font-family:var(--f-ui);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
#eco.dim .nd{opacity:.2}
#eco.dim .nd.hl{opacity:1}
#eco.searching .nd:not(.match){opacity:.15}
.rels{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.rels small{color:var(--muted);font-family:var(--f-ui);font-size:12px}
.ihead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.natura{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.nat{border-top:4px solid var(--c);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.nat h3{font-size:24px}
.nat p{font-size:15.5px}
.nat .n{font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.senses{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.sense{font-family:var(--f-ui);font-size:14px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}
.sense b{font-weight:800}
@media (max-width:980px){.natura{grid-template-columns:minmax(0,1fr)}}
.es.nat .mk{stroke:var(--m-ben);stroke-width:2.5}
.ecoinfo{position:absolute;left:12px;top:12px;width:min(330px, calc(100% - 24px));background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:14px 16px;max-height:calc(100% - 24px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.ecoinfo h3{font-size:19px}
.ecoinfo p{font-size:14px}
.ecotools{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:12px}
.ecocount{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}
.ecohint{font-size:13px;color:var(--muted);margin-top:10px}
@media (max-width:640px){.ecoinfo{position:static;width:auto;border:none;border-top:1px solid var(--line);border-radius:0}}
</style>
