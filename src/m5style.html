<style>
/* ---------- Laboratorio: fondo scuro, caratteri tecnici, verde lime per le azioni. La mappa resta com'era, su una lastra chiara. ---------- */
:root:not(#z){
  --bg:#0C1411; --surface:#131D19; --surface2:#18241F; --ink:#E6EDE8; --muted:#93A39A; --line:#24322B; --accent:#C6F36B; --link:#9BE0C8; --nat:#7FD98A;
  --c-sis:#82B3D8; --c-soc:#E58C74; --c-lav:#D3B353; --c-lea:#B79AD8; --c-cam:#6EC4B9; --c-evo:#E386AF; --c-nat:#93CB73;
  --m-ind:#FF6A4D; --m-com:#2AAEFF; --m-lea:#9B6BFF; --m-cul:#FF4F9C; --m-cam:#FFA733; --m-app:#1FD3C3; --m-ben:#FFD23F; --m-tra:#6E84FF;
  --ring:#1A2621; --ring2:#131D19;
  --f-display:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --f-ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --f-mono:"DM Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
::selection{background:var(--accent);color:#0C1411}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em}
a{color:var(--link)}
a:hover{color:var(--accent)}
:focus-visible{outline-color:var(--accent)}
.eyebrow,.ctl-label,.mono,.sect h2,.side .box h3,.bsec h3,.spcol h4{font-family:var(--f-mono)!important;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.eyebrow{color:var(--accent);font-size:11.5px}
.ctl-label{color:var(--muted);font-size:11px}

/* intestazione: spazio per il logo e sottotitolo completo */
header.top{height:auto!important;min-height:68px;padding-block:12px!important;align-items:center!important;flex-wrap:wrap;gap:10px 20px;border-bottom:1px solid var(--line)}
.top .brand > span{margin:0!important}
.top .brand .bname{display:block!important;text-transform:none!important;color:var(--ink)!important;letter-spacing:-.02em!important;font-family:var(--f-display)!important}
.top .brand{flex:0 1 auto}
.top nav{margin-left:auto;max-width:100%}
.top .brand{display:grid!important;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;align-items:center;color:var(--ink)!important;text-decoration:none;min-width:0;overflow:visible!important;white-space:normal!important}
.top .brand .logo{grid-row:1 / span 2;width:40px;height:40px;color:var(--accent);display:block}
.top .brand .logo svg,.top .brand .logo img{width:100%;height:100%;display:block}
.top .brand .bname{font:800 20px/1.05 var(--f-display);letter-spacing:-.03em}
.top .brand .bsub{display:block!important;margin:2px 0 0!important;font:400 11.5px/1.3 var(--f-mono)!important;letter-spacing:.02em!important;text-transform:none!important;color:var(--muted)!important}
.top nav{gap:4px!important;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.top nav::-webkit-scrollbar{display:none}
.top nav a{font:500 13.5px var(--f-ui)!important;color:var(--muted);text-decoration:none!important;padding:7px 11px;border-radius:8px;white-space:nowrap}
.top nav a:hover{color:var(--ink);background:var(--surface)}
.top nav a[aria-current="page"]{color:#0C1411!important;background:var(--accent);text-decoration:none!important}
@media (max-width:900px){.top nav{width:100%;margin-left:0}}
@media (max-width:520px){.top .brand .bname{font-size:18px}.top .brand .bsub{font-size:10.5px}.top .brand .logo{width:34px;height:34px}}

/* pulsanti, chip, campi */
.btn{font:600 13.5px var(--f-ui)!important;background:var(--accent);color:#0C1411;border:1px solid var(--accent);border-radius:10px;padding:9px 16px}
.btn:hover:not(:disabled){background:#D6FA8C;border-color:#D6FA8C}
.btn.ghost{background:var(--surface2);color:var(--ink);border-color:#2C3A33}
.btn.ghost:hover:not(:disabled){background:#1F2D27;border-color:#3A4C44}
.btn.danger{background:transparent;color:#FF8A7A;border-color:#5A2E28}
.btn.sm{padding:5px 11px;font-size:12px!important}
.chip,.topicbtn{font-family:var(--f-ui);background:var(--surface);color:var(--ink);border:1px solid #2C3A33;border-radius:8px}
.chip:hover,.topicbtn:hover{border-color:#4A5E54}
.chip[aria-pressed="true"],.topicbtn[aria-pressed="true"],.tools .chips .chip[aria-pressed="true"]{background:var(--accent);color:#0C1411;border-color:var(--accent)}
.chip[aria-pressed="true"] small,.topicbtn[aria-pressed="true"] small{color:#0C1411}
.tools .chips .chip.nat[aria-pressed="true"]{background:var(--nat);border-color:var(--nat);color:#0C1411}
.search,select,select.sort,input,textarea{background:var(--surface);color:var(--ink);border-color:#2C3A33}
.search:focus,select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:none}
form.edit input,form.edit select,form.edit textarea,.bform textarea,.refrow input{background:#0F1814;border-color:#2C3A33;color:var(--ink)}
.ctxsel{background:var(--accent)!important;color:#0C1411!important;border-color:var(--accent)!important;font-family:var(--f-ui)}
.linkbtn{color:var(--link)}
.tg,.minichip{font-family:var(--f-mono)}

/* superfici */
.side .box{border-top:1px solid var(--line);padding-top:12px}
.sect{border-top-color:var(--line)}
.azcard,.bcard,.azform,details.dform,.card,.leva,.level,.bridge{background:var(--surface);border-color:var(--line)}
.bout{border-top-color:var(--ink)}
.bprove a,.pubs a{color:var(--ink)}
.bprove a:hover,.pubs a:hover{color:var(--accent)}
a.bdeep{color:var(--ink);text-decoration-color:#4A5E54}
a.bdeep::after{color:var(--accent)}
.lezpill{background:var(--accent);color:#0C1411}
.rqst{border-color:#2C3A33}
.verify{color:var(--muted)}
footer{border-top-color:var(--line);color:var(--muted);font-family:var(--f-mono)!important;font-size:11.5px}

/* l'archivio come schede affiancate */
.results{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;margin-top:6px}
.results .row{background:var(--surface);border:1px solid var(--line)!important;border-radius:14px;padding:16px 16px 14px!important;align-content:start}
.results .row:hover{border-color:#3A4C44!important;background:var(--surface2)}
.results .row .rt{font:600 16px/1.3 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.results .row:hover .rt{color:var(--accent)}
.results .row .ra{font-size:13px;color:var(--muted)}
.results .row .tg{background:var(--surface2);border:1px solid #2C3A33;color:var(--link);border-radius:6px}

/* la home: la mappa resta identica, su una lastra chiara con i suoi colori */
#pHome{height:calc(100svh - 69px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))!important}
#ecoWrap{
  --bg:#FAFAF8; --surface:#FFFFFF; --ink:#141414; --muted:#6B6B6B; --line:#E4E4E0; --accent:#0B6BFF; --nat:#10B04A;
  --c-sis:#3B6F94; --c-soc:#B5523B; --c-lav:#8C6D1F; --c-lea:#6E4A8E; --c-cam:#2D8077; --c-evo:#A8436F; --c-nat:#4E8A35;
  --m-ind:#FF4D2E; --m-com:#0096FF; --m-lea:#7A3CFF; --m-cul:#FF2D87; --m-cam:#FF9500; --m-app:#00B8A9; --m-ben:#F2B800; --m-tra:#2B44C7;
  --ring:#F1F1EC; --ring2:#FAFAF6; --f-ui:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light; color:var(--ink); background:var(--bg)!important;
  inset:10px 14px 14px!important; border-radius:18px!important; border:1px solid #24322B!important;
}
.thesis{background:color-mix(in srgb, #0C1411 92%, transparent)!important;color:var(--ink);border:1px solid var(--line)!important;border-radius:14px;padding:16px 18px!important;backdrop-filter:blur(6px)}
.thesis h1{font-family:var(--f-display);font-weight:700;letter-spacing:-.025em}
.thesis p{color:#B9C6BE}
.ttog{border-color:#2C3A33!important;color:var(--muted)!important}
.ttog:hover{color:var(--ink)!important;border-color:var(--accent)!important}
@media (min-width:761px){.thesis,.tools{top:26px!important}.thesis{left:30px!important}.tools{right:30px!important}}
.tools .chips,.tools .sbox{background:color-mix(in srgb, #0C1411 88%, transparent);border-radius:12px;padding:6px}
.legend.ov{background:color-mix(in srgb, #0C1411 90%, transparent);color:var(--ink);border-radius:10px;padding:6px 12px;left:30px!important;bottom:26px!important;font-family:var(--f-mono)}
.stats.ov,.ov.stats{background:color-mix(in srgb, #0C1411 90%, transparent);color:var(--ink);border-radius:10px;padding:6px 12px;right:30px!important;bottom:26px!important;font-family:var(--f-mono)}
.ecoinfo{background:color-mix(in srgb, #0C1411 95%, transparent)!important;color:var(--ink);border:1px solid var(--line)!important;border-radius:14px!important;left:30px!important}
.ponte{background:var(--surface)!important;border-right-color:var(--line)!important;border-radius:0 18px 18px 0;top:10px!important;bottom:14px!important;left:14px!important}
@media (max-width:760px){
  #ecoWrap{inset:6px 0 8px!important;border-radius:14px!important}
  .legend.ov{left:12px!important;bottom:14px!important}
  .thesis{left:12px!important}
  .stats.ov,.ov.stats{display:none}
  .ponte{left:0!important;bottom:0!important;border-radius:14px 14px 0 0}
}

/* l'archivio: barra di ricerca, filtri a scomparsa, filtri attivi */
#pathBar,#tagBar{display:none!important}
.archead{margin:6px 0 18px;display:flex;flex-direction:column;gap:8px}
.archead h2{font-size:clamp(26px,3.4vw,38px)}
.archead p{color:var(--muted);max-width:72ch}
.archbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.archbar .search.big{flex:1 1 320px;min-width:0;width:auto;font-size:15px;padding:11px 14px;border-radius:10px}
.archbar .ctxsel{padding:10px 12px;border-radius:10px;max-width:100%}
.archbar .btn{padding:10px 16px}
.fnum{color:var(--accent);margin-left:2px}
.filtpanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px 16px;margin-bottom:14px}
.filtpanel .filt-h:first-child{margin-top:10px}
.attivi{margin:4px 0 10px;display:flex;flex-direction:column;gap:6px}
.attrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.attrow .chip.on{background:var(--accent);color:#0C1411;border-color:var(--accent);font-weight:600}
.attrow .chip .fk{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-right:6px}
.fdef{font-size:13px;color:var(--muted);max-width:80ch;margin:0}
.fdef b{color:var(--ink);font-weight:600}
.zero{grid-column:1 / -1;background:var(--surface);border:1px dashed #3A4C44;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.zero ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.zero li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.zero .btn{align-self:flex-start}

/* il pannello del tema: numeri prima del grafico, domanda spiegata, analogie in schede */
.pcap{display:flex;flex-direction:column;gap:4px}
.pstat2{font-size:13.5px;color:var(--ink)}
.pstat2 b{font-family:var(--f-display);font-size:16px}
.natc{color:var(--nat)!important}
.pcap2{font-size:11.5px;color:var(--muted);line-height:1.5}
.tq{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:12px 0;display:flex;flex-direction:column;gap:4px}
.tq p{font-size:15px;font-weight:600;margin:0}
.tqh{font-size:12px;color:var(--muted);line-height:1.5}
.pcards{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pcard{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--nat);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface2)}
.pcard:hover{border-color:var(--nat)}
.pcard span{font-size:12.5px;color:var(--muted)}
.pcard .pgo{color:var(--accent);font-weight:600}
/* la pagina dell'analogia */
.anhead{margin:8px 0 18px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.anhead h2{font-size:clamp(26px,3.4vw,40px);text-wrap:balance;margin:2px 0 6px}
.angrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.ansec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.ansec.nat{border-top:3px solid var(--nat)}
.ansec.lim{border-top:3px solid #E58C74}
.ansec h3{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.ansec p{margin:0;font-size:15px;line-height:1.65;max-width:70ch}
.anrefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:22px;margin-top:26px}
.anrefs h3{font-size:16px;margin:0 0 10px}
.anlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ancard{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.ancard .dot{margin-top:6px}
.ancard a{color:var(--ink);text-decoration:none}
.ancard a:hover{color:var(--accent)}
.ancard .rmeta{display:block;font-size:12px}
.ancard .pext{font-size:12px;color:var(--link);margin-left:0}
.antemi{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px}
/* l'archivio diviso in due gruppi */
.rgroup{grid-column:1 / -1;font:600 15px var(--f-display);margin:14px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rgroup:first-child{margin-top:0}
.rgroup.nat{color:var(--nat);margin-top:26px}

/* leve: titolo in evidenza, origine e studi in chiaro */
.leve .leva h3{color:var(--accent);font-size:19px;font-family:var(--f-display);letter-spacing:-.01em}
.leve .leva .lvorig{font-size:13px!important;color:var(--muted)}
.leve .leva .lvorig b,.leve .leva .lvseg b{color:var(--ink)}
.lvstudi{display:flex;flex-direction:column;gap:4px;font-size:12.5px;padding-top:8px;border-top:1px dashed var(--line)}
.lvstudi ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.lvstudi a{color:var(--link);font-weight:600}
.lvstudi .lvtit{color:var(--muted)}
.leve .leva .btn.lvgo{align-self:flex-start;margin-top:auto}
/* tutti i pulsanti: verde fluo e testo nero */
.btn.ghost{background:var(--accent);color:#0C1411;border-color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:#D6FA8C;border-color:#D6FA8C}
.chip.go{background:var(--accent);color:#0C1411;border-color:var(--accent);font-weight:600}
.chip.go:hover{background:#D6FA8C;border-color:#D6FA8C}
.chip.go .dot{box-shadow:0 0 0 1.5px #0C1411}

/* telefono: pagina che scorre, temi in elenco, mappa sotto, tema a pagina piena */
.mtemi{display:none}
@media (max-width:760px){
  #pHome{height:auto!important;margin-inline:0!important;display:flex;flex-direction:column;gap:18px;padding-block:6px 28px}
  #pHome .ov.thesis,#pHome .ov.tools{position:static!important;width:auto!important;inset:auto!important}
  #pHome .thesis{order:1}
  #pHome .mtemi{order:2;display:flex;flex-direction:column;gap:22px}
  #pHome .tools{order:3}
  #pHome #ecoWrap{order:4;position:relative!important;inset:auto!important;height:min(100vw,520px);border-radius:14px!important}
  #pHome .legend.ov,#pHome .stats{display:none!important}
  #pHome .pathsel{display:none}
  #pHome .sug{top:calc(100% + 4px);bottom:auto}
  #eco .ndl{display:none}
  .ecoinfo{position:fixed!important;left:8px!important;right:8px!important;bottom:8px!important;top:auto!important;width:auto!important;max-height:62vh!important;overflow:auto;z-index:20}
  body.ponteopen #pHome > :not(#ponte){display:none!important}
  #pHome .ponte{position:static!important;width:auto!important;height:auto!important;max-height:none!important;overflow:visible!important;border:none!important;border-radius:0!important;padding:4px 0 24px!important;background:transparent!important;inset:auto!important}
  .mthead{display:flex;flex-direction:column;gap:6px}
  .mthead h2{font-size:22px;line-height:1.15}
  .mthead p{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0}
  .mliv{display:flex;flex-direction:column;gap:8px;padding:0;border:0;margin:0}
  .mliv h3{display:flex;align-items:center;gap:10px;font-size:13px;font-family:var(--f-mono);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0}
  .mliv .mn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--accent);font-size:11px}
  .mrows{display:flex;flex-direction:column;gap:8px}
  .mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none}
  .mrow:active{border-color:var(--accent)}
  .mrt{font-weight:600;font-size:15.5px;line-height:1.25}
  .mrn{font:500 12px var(--f-mono);color:var(--accent);white-space:nowrap;align-self:start;padding-top:2px}
  .mrd{grid-column:1 / -1;color:var(--muted);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mmap{color:var(--muted);font-size:13px;margin:0}
  /* archivio compatto: le schede subito sotto la ricerca */
  .archead{margin:0 0 10px}
  .archead p{display:none}
  .archbar{gap:8px}
  .archbar .search.big{flex:1 1 100%}
  .archbar .ctxsel{flex:1 1 0;min-width:0}
  .results .row .rt{font-size:15px}
}

/* chiusura della presentazione e pagina Chi siamo */
.thesis .ttog{right:46px!important}
.tclose{position:absolute;top:10px;right:10px;width:28px;height:26px;display:grid;place-items:center;font:600 13px var(--f-ui);background:none;border:1px solid #2C3A33;border-radius:999px;color:var(--muted);cursor:pointer;padding:0}
.tclose:hover{color:#0C1411;background:var(--accent);border-color:var(--accent)}
.chisiamo{max-width:760px;display:flex;flex-direction:column;gap:16px;padding-block:8px 40px}
.chisiamo h1{font-size:clamp(26px,3.6vw,40px);line-height:1.12;text-wrap:balance}
.chisiamo p{font-size:17px;line-height:1.6;max-width:65ch;margin:0;color:#B9C6BE}
.chisiamo .csmail{font-size:15px;color:var(--muted)}
.chisiamo .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chisiamo .actions .btn{text-decoration:none}
@media (max-width:760px){.top nav{flex-wrap:wrap;overflow:visible;gap:2px!important}.top nav a{padding:6px 7px;font-size:12.5px!important}}

/* archivio: livelli e aree sempre visibili sopra le schede */
.archlev{margin:4px 0 14px}
.archlev .filt-h{margin-top:6px}
.archlev .levgrid{border-top:2px solid var(--ink)}
.archlev .lvcol{padding-block:12px}
.archlev .lvh{font-size:16px;font-family:var(--f-display)}
.archlev .lvh .lvn{font-family:var(--f-mono)}
.archlev .lvd{margin:0 0 4px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.archlevtog{display:none}
@media (max-width:760px){.archlev .lvd,.archlev .filt-h{display:none}.archlev .lvh{font-size:14.5px}
  .archlevtog{display:block;width:100%;text-align:left;font:600 14px var(--f-ui);color:#0C1411;background:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:11px 14px;cursor:pointer}
  .archlev:not(.aperto) .levgrid{display:none}
  .archlev.aperto .levgrid{margin-top:10px}}

/* telefono: la home scorre (sul computer resta bloccata sulla mappa a tutto schermo) */
@media (max-width:760px){body.home{overflow:visible!important}#eco{touch-action:pan-y!important}}

/* telefono: scheda della mappa opaca e mappa a schermo intero */
.mapfull,.maphint{display:none}
@media (max-width:760px){
  .ecoinfo{background:var(--surface)!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
  .mapfull{display:block;position:absolute;left:10px;right:10px;bottom:10px;z-index:3;font:600 14px var(--f-ui);color:#0C1411;background:#C6F36B;border:1px solid #9FCC45;border-radius:10px;padding:11px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  body.mappafull{overflow:hidden!important}
